schema: spec-driven

context: |
  Project: DELTA Resilience — Disaster & Hazardous Events, Losses and Damages Tracking & Analysis.
  Built for UNDRR. Multi-tenant, multi-language national disaster tracking with geospatial features.

  Tech stack: TypeScript (strict mode), React Router v8 (Remix-style SSR), Express 5,
  Drizzle ORM, PostgreSQL 17 + PostGIS. Package manager: yarn.

  Architecture layers:
  - app/routes/$lang+/        — React Router route modules (file-based, language-prefixed URLs)
  - app/backend.server/       — Server-only code (never bundled to client)
    - models/                 — DB access layer; one file per table
    - handlers/               — Shared request handlers (form, CSV, API)
    - services/               — Business logic (access management, organisations)
  - app/frontend/             — Shared frontend components and form definitions
  - app/drizzle/schema/       — Drizzle table definitions and type exports
  - app/utils/                — Shared utilities (auth, session, email, security)

  Key conventions:
  - Multi-tenancy: ALL queries must be scoped with countryAccountsId. Never fetch across tenants.
  - Auth: wrap every loader with authLoaderWithPerm, every action with authActionWithPerm.
    Never use authLoaderApiDocs — it skips tenant checks (known bug P1-22).
  - Form-CSV-API pattern: fieldsDef drives forms, CSV import/export, and REST API simultaneously.
    Never remove fieldsDef from a model even when replacing formScreen() with PrimeReact JSX.
  - DB migrations: yarn dbsync ONLY (drizzle-kit migrate). NEVER drizzle-kit push.
    When adding a column, also update tests/integration/db/testSchema/ until P1-42 is resolved.
  - Server-only files: use .server.ts(x) suffix. Path alias ~/* maps to app/*.
  - Translation: ctx.t({ code: "key", msg: "Fallback" }). Run yarn i18n:extractor after adding strings.
  - New env vars: add to example.env with a comment.
  - Branches from dev, PRs target dev. Commit prefixes: Bug:, Feature:, Refactor:, Docs:.
  - Style: Prettier (tabs, 80-char width, trailing commas). Run npx prettier --check <files> before committing.

  Testing infrastructure:
  - yarn test:run2  — Vitest + PGlite integration tests (no external DB needed). PRIMARY test suite.
  - yarn test:run3  — Vitest integration tests against real PostgreSQL (needs .env.test).
  - yarn test:dom   — Vitest + jsdom component interaction tests (vitest.dom.config.ts).
  - yarn test:e2e   — Playwright end-to-end tests (expects PORT=4000).
  - yarn vitest run path/to/test.ts  — Run a single test file.
  - DO NOT use node:test. app/backend.server/models/*_test.ts files are orphaned — do not extend them.
  - New tests go under tests/ using Vitest. PGlite setup: tests/integration/db/setup.ts.
  - createTestBackendContext() constructs test contexts. See tests/integration/db/ for patterns.
  - Test file naming: always *.test.ts (e.g. common.test.ts) — never *_test.ts.
  - Setup import path: `import "./setup"` for files directly in tests/integration/db/;
    `import "../setup"` for files one level deeper (e.g. tests/integration/db/queries/).

  Critical anti-patterns: see .github/skills/anti-pattern-check/SKILL.md — never reproduce any item listed there.

  UI Design Authority:
  - Design-system authority: https://github.com/unisdr/delta-design (semantic tokens, reusable
    components, typography, spacing, layout, iconography, chart conventions, interaction behaviour,
    and accessibility requirements). Local reference files (DESIGN.md, tokens.json, tokens.css) are
    manually synced from a pinned tag/commit of unisdr/delta-design.
  - Feature design hand-off authority: https://github.com/unisdr/delta-feature-prototypes
    (feature-specific prototypes demonstrating approved application of the DELTA Design System).
  - Target UI stack for new or migrated screens: React Aria Components (accessible component
    foundation), Tailwind CSS v4, Lucide React, Recharts, semantic design tokens, and WCAG 2.2
    Level AA compliance. All reusable React Aria design-system primitives MUST live under
    app/design-system/components/ (exported from app/design-system/components/index.ts, imported via
    ~/design-system/components) — do not create a separate app/design-system/ui/ directory.
  - Coexistence during migration: legacy custom CSS (dts-*, mg-*, formScreen()) and interim
    PrimeReact screens coexist with new React Aria screens. Every change must declare its
    ui-classification as react-aria, legacy-exempt, or non-visual.

rules:
  proposal:
    - Scope to a single coherent concern. If the change touches unrelated files, split it.
    - List every file expected to change with a one-line reason.
    - State explicitly whether a DB migration is required.
    - "State the test approach: PGlite (test:run2) or real DB (test:run3) or DOM (test:dom) or E2E (test:e2e)."
    - If the change affects auth or multi-tenancy, call it out as a security-sensitive change.

  specs:
    - Use Given/When/Then format with RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Reference the exact model function or route handler being specified.
    - Include both the happy path and the failure/error path as separate scenarios.
    - Do not specify implementation details — specify observable behaviour only.

  design:
    - Name every TypeScript type or interface that will be added or changed.
    - If Drizzle schema changes are needed, describe the column additions explicitly.
    - Identify whether tests use PGlite or require a real DB, and why.
    - Note any impact on the Form-CSV-API fieldsDef pipeline.
    - "Always record ui-classification: react-aria | legacy-exempt | non-visual."
    - "For any change affecting UI presentation or interaction, include the design-system and feature-prototype metadata block with immutable references (release tag and/or commit SHA, never solely a moving branch like main): design-system (repository: https://github.com/unisdr/delta-design, version-or-tag, commit) and feature-prototype (repository: https://github.com/unisdr/delta-feature-prototypes, path, commit, status: required | approved | not-required, exception-reason when not-required)."
    - "For UI changes, specify: affected routes and presentation components; selected design tokens and UI components; content and interaction ground-truth checklist; field and column order; sorting, filtering, and pagination defaults; empty, loading, error, success, and destructive-action states; responsive expectations; keyboard behaviour and focus order; minimum 24x24 CSS pixel target size (32x32 preferred for icon-only controls); accessible names and label-in-name expectations; copy and localisation requirements (sentence case, DELTA content guidance, no em dashes); and any documented and approved deviations from the prototype or design system."

  tasks:
    - "TDD order is mandatory: write the failing Vitest test first, then implement, then refactor."
    - Each task must be independently runnable (yarn vitest run path/to/test.ts).
    - Test files use *.test.ts naming — never *_test.ts.
    - If a DB migration is involved, yarn dbsync is a task — never drizzle-kit push.
    - "Quality gate 1 of 10: yarn vitest run <test-file> — tests still green after refactor"
    - "Quality gate 2 of 10: yarn tsc — zero TypeScript errors"
    - "Quality gate 3 of 10: yarn format:check — Prettier clean (run npx prettier --write <files> to fix)"
    - "Quality gate 4 of 10: Anti-pattern review — check .github/skills/anti-pattern-check/SKILL.md"
    - "Quality gate 5 of 10: SOLID review — invoke solid-reviewer agent"
    - "Quality gate 6 of 10: Documentation review — comments explain WHY not WHAT, compacted where possible without losing meaning (no fixed line-count limit); one full-diff sweep before the final report, not just each round's delta, done by a fresh subagent (not self-review)"
    - "Quality gate 7 of 10: Project conventions review — check .github/copilot-instructions.md"
    - "Quality gate 8 of 10: Code review — run .github/skills/code-review/SKILL.md in full, via a fresh subagent"
    - "Quality gate 9 of 10: Design system, accessibility & prototype parity review — required if this change touches app/domains/*/presentation/, app/routes/, app/components/, app/design-system/, or related styles (else skip and say so explicitly). Runs Gate 9a (static design-system and token compliance via yarn check:design-system + .github/skills/design-system-check/SKILL.md), Gate 9b (automated WCAG 2.2 AA axe-core and keyboard checks via tests/e2e/helpers/a11y.ts), and Gate 9c (implementation parity with the approved feature prototype, retaining commands, reports, screenshots in test-results/gate-9/<name>/, and review outcomes in openspec/changes/<name>/evidence/gate-9-report.md, audited by a fresh subagent)"
    - "Quality gate 10 of 10: Independent second-opinion review, Claude Code only — its built-in code-review at high effort via a second fresh subagent; other tools use an equivalent platform feature or skip"
    - "If this change adds or modifies any file under app/domains/** that contains real implementation logic (not a type-only interface/port declaration, not a trivial re-export): add a test quality task — invoke test-quality-auditor scoped to the changed files, resolve any real gap found"
    - "After all applicable gates: add a mandatory regression task — yarn test:run2 (full PGlite suite) must pass with no new failures before archiving; pre-existing failures must be confirmed as pre-existing, not assumed"
    - "Final task after the regression task: run opsx:archive on the same branch before raising the PR."
