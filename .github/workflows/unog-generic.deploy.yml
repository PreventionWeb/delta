name: Deploy Generic Container to UNOG (Dev 2)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Target branch to build from (e.g. hotfix/auth-tenant-validation; leave empty to use the workflow branch)"
        type: string
        required: false
        default: ""

concurrency:
  group: unog-generic-deploy-branch-testing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: delta-country
      IMAGE_TAG: branch-testing
      DEPLOY_ENVIRONMENT: branch-testing

    steps:
      - name: Resolve target branch
        id: target_ref
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          DEFAULT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          trimmed_branch="$(printf '%s' "$INPUT_BRANCH" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -n "$trimmed_branch" ]; then
            if printf '%s' "$trimmed_branch" | grep -q '[[:space:]]'; then
              echo "::error::Invalid branch name: contains whitespace."
              exit 1
            fi
            echo "Building from input branch: ${trimmed_branch}"
            echo "ref=${trimmed_branch}" >> "$GITHUB_OUTPUT"
            echo "branch=${trimmed_branch}" >> "$GITHUB_OUTPUT"
          else
            echo "Building from workflow branch: ${DEFAULT_BRANCH}"
            echo "ref=${DEFAULT_REF}" >> "$GITHUB_OUTPUT"
            echo "branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target_ref.outputs.ref }}

      - name: Resolve build metadata
        id: meta
        env:
          TARGET_BRANCH: ${{ steps.target_ref.outputs.branch }}
        run: |
          if [ ! -f ./Dockerfile.dev ]; then
            echo "::error::Dockerfile.dev not found on branch '${TARGET_BRANCH}'."
            exit 1
          fi

          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          commit_sha="$(git rev-parse HEAD)"

          echo "Using image: ${REGISTRY}/${owner_lc}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Branch: ${TARGET_BRANCH} (${commit_sha})"
          echo "image_owner=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "sha=${commit_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (GitHub)
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=DELTA country instance container image for branch testing deployments.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.ref.name=${{ steps.target_ref.outputs.branch }}
          cache-from: type=gha,scope=unog-branch-testing
          cache-to: type=gha,mode=max,scope=unog-branch-testing

      - name: Build image locally (act)
        if: ${{ env.ACT }}
        run: >-
          docker build
          -f ./Dockerfile.dev
          -t ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          .

      - name: Trigger Automatic Branch-Testing Deploy Hook
        if: ${{ !env.ACT }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ steps.target_ref.outputs.branch }}
          DEPLOY_SHA: ${{ steps.meta.outputs.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL is not set; skipping deploy webhook."
            exit 0
          fi

          payload="$(jq -n \
            --arg event "deploy" \
            --arg environment "$DEPLOY_ENVIRONMENT" \
            --arg repo "$DEPLOY_REPO" \
            --arg branch "$DEPLOY_BRANCH" \
            --arg sha "$DEPLOY_SHA" \
            --arg actor "$DEPLOY_ACTOR" \
            '{event: $event, environment: $environment, repo: $repo, branch: $branch, sha: $sha, actor: $actor}')"

          curl --fail-with-body --silent --show-error \
            -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"
