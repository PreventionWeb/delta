; Supervisor config for the Azure App Service image (Dockerfile.azure).
; Runs the DELTA app alongside sshd so Azure Web SSH (port 2222) works.
; Logs go to the container's stdout/stderr so they show up in Azure Log Stream.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:delta]
directory=/delta
command=yarn start
autorestart=true
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
