; Supervisor config for the Azure App Service image (Dockerfile.azure).
; Runs NGINX (public :80) in front of the DELTA app (internal 127.0.0.1:3000),
; alongside sshd so Azure Web SSH (port 2222) works.
; Logs go to the container's stdout/stderr so they show up in Azure Log Stream.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:delta]
directory=/delta
command=yarn start
autorestart=true
stopsignal=TERM
stopwaitsecs=20
; Bind to loopback only: the app is reachable solely through NGINX
environment=HOST="127.0.0.1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
