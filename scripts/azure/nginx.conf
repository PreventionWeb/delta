# NGINX site config for the Azure App Service image (Dockerfile.azure).
# Public HTTP on :80, reverse-proxied to the DELTA app on 127.0.0.1:3000.
# Hostname-agnostic (catch-all) so one image serves DEV/TEST/PROD.
# Logs go to the container's stdout/stderr so they show up in Azure Log Stream.

map $http_x_forwarded_proto $delta_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

map $http_x_forwarded_host $delta_forwarded_host {
  default $http_x_forwarded_host;
  ""      $http_host;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80 default_server;
  server_name _;

  access_log /dev/stdout;
  error_log  /dev/stderr;

  client_max_body_size 64m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $delta_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $delta_forwarded_host;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 300s;
  }
}
