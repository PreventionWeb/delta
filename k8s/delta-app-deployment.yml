apiVersion: apps/v1
kind: Deployment

metadata:
  name: delta-local-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: delta-local-app

  template:
    metadata:
      labels:
        app: delta-local-app

    spec:
      initContainers:
        - name: wait-for-database
          image: postgis/postgis:17-3.5
          command:
            - sh
            - -c
            - |
              until pg_isready \
                -h delta-local-db \
                -p 5432 \
                -U postgres \
                -d dts-shared-01
              do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready."

      containers:
        - name: delta-local-app
          # Floating development tag used to identify the source image:
          # image: ghcr.io/preventionweb/delta-country:dev-latest

          # Immutable image reference used for reproducible deployments:
          image: ghcr.io/preventionweb/delta-country@sha256:e75a3572f394b79ede4ebf2877c4d76213b7c498029c7edb8901fe1099aee0c5
          envFrom:
            - configMapRef:
                name: delta-local-app-config
            - secretRef:
                name: delta-local-app-secret

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          volumeMounts:
            - name: uploads
              mountPath: /delta/uploads

          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: delta-local-uploads
