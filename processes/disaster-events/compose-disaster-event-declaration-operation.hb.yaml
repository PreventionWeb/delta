id: compose-disaster-event-declaration-operation
type: operation
description: >
  Persist the declaration's fields, replacing its attachments wholesale with
  the submitted set (not diffed). No sector-level breakdown exists for
  declarations, unlike assessments (see
  compose-disaster-event-assessment-operation). Confirmed with the domain
  expert: this operation is independent of the disaster event's own
  approval/validation status by design, same as assessments and responses —
  verified with no coupling found across the API layer, the disaster-event
  validation-workflow model, or the approval SaveSubmitDialog UI.
context: delta-platform
actor: delta-platform-engine
activatedBy: [compose.disaster.event.declaration]
processes: [disaster-events]

constraints:
  - id: parent-event-in-tenant
    description: Re-checked at execution time — same rule as the paired policy
    reads: [disaster.event.declaration.disaster.event.country.account]

  - id: declaration-status-resolvable-if-set
    description: Re-checked at execution time — same rule as the paired policy
    reads: [disaster.event.declaration.status]

  - id: declaration-exists-on-update
    description: When updating an existing declaration (not creating a new one), the target row must already exist
    reads: [disaster.event.declaration.exists]

unconditionalOutcome:
  kind: disaster.event.declaration.composed
  description: The declaration exists with its fields synced; attachments are fully replaced
  effects:
    - point: disaster.event.declaration.exists
      description: Created, or its fields updated
    - point: disaster.event.declaration.attachments
      description: Replaced wholesale with the submitted attachment set (not diffed)

conditionalOutcomes: []
